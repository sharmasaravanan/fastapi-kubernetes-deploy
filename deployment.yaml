apiVersion: apps/v1
kind: Deployment
metadata:
  name: power-health-api
  labels:
    app: power-health-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: power-health-api
  template:
    metadata:
      labels:
        app: power-health-api
    spec:
      containers:
        - name: api
          image: power-health-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "power-health-api"
            - name: APP_ENV
              value: "local-kubernetes"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
